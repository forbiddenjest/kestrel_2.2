<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ status }} · Kestrel</title>
  <link rel="icon" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/app.css?v={{ app_version }}">
</head>
<body class="auth-body">
<main class="auth-stage">
  <div class="auth-card error-card">
    <img class="auth-logo" src="/static/kestrelwordmark.png" alt="Kestrel" width="150" height="36">
    <div class="error-code">{{ status }}</div>
    <p>{{ message }}</p>
    <div class="row-actions"><a class="btn btn-primary" href="/dashboard">Go to dashboard</a></div>
  </div>
</main>
<footer class="credit" role="contentinfo">Kestrel - PlexScale Software</footer>
</body>
</html>
